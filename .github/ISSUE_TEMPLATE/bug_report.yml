name: Bug report / 問題回報
description: Something does not work as expected. / 功能未如預期運作。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Fill in what you can; the browser and version make the problem easier to reproduce.
        感謝回報。請盡量填寫，瀏覽器與版本能幫助重現問題。
  - type: dropdown
    id: browser
    attributes:
      label: Browser / 瀏覽器
      options:
        - Chrome
        - Edge
        - Firefox
        - Other Chromium browser / 其他 Chromium 瀏覽器
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version / 擴充功能版本
      description: Shown on the browser's extensions page. / 顯示在瀏覽器的擴充功能頁面。
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where / 發生位置
      options:
        - Download All on a profile page / 個人檔案頁的下載全部
        - Single download / 單項下載
        - Popup (account list, settings) / 工具列視窗（帳號清單、設定）
        - Import or folders / 匯入或資料夾
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 重現步驟
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected / 預期結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual / 實際結果
      description: Attach a screenshot if it helps. Do not include account names you do not want public. / 有截圖請一併附上。請勿貼上不想公開的帳號名稱。
    validations:
      required: true
