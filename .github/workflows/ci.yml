name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Sorts the change set: a change that touches only documentation and the
  # landing page skips the build. An empty diff or an unresolvable base counts
  # as code. `ci` stays the single required check.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -u
          code=true
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            base="$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null || true)"
            [ -n "$base" ] && range="$base HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE HEAD"
          fi
          if [ -n "$range" ]; then
            # shellcheck disable=SC2086
            files="$(git diff --name-only $range)"
            if [ -n "$files" ]; then
              code=false
              while IFS= read -r f; do
                case "$f" in
                  *.md|docs/*|.github/ISSUE_TEMPLATE/*|LICENSE|CNAME) ;;
                  *) code=true ;;
                esac
              done <<< "$files"
            fi
          fi
          echo "range=${range:-none}"
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx puppeteer browsers install chrome
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: builds
          path: |
            dist
            dist-firefox
          retention-days: 7

  # The one check branch rules refer to; it passes when nothing had to run.
  ci:
    needs: [changes, check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "changes=${{ needs.changes.result }} check=${{ needs.check.result }}"
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          [ "${{ needs.check.result }}" = "success" ] || [ "${{ needs.check.result }}" = "skipped" ] || exit 1
