<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memfolio</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1><span class="tab">Memfolio</span></h1>
      <div class="tools">
        <button id="options" class="iconbtn" type="button"></button>
        <button id="back" class="iconbtn" type="button" hidden></button>
      </div>
    </header>
    <section id="accounts">
      <div class="titlebar">
        <h2 id="count"></h2>
        <div class="tools">
          <button id="new-group" class="iconbtn" type="button"></button>
          <button id="transfer" class="iconbtn" type="button"></button>
        </div>
      </div>
      <div id="controls">
        <input id="filter" type="search" autocomplete="off" />
        <select id="sort-by">
          <option id="sort-name" value="name"></option>
          <option id="sort-last-run" value="lastRun"></option>
          <option id="sort-files" value="files"></option>
          <option id="sort-added" value="added"></option>
          <option id="sort-manual" value="manual"></option>
        </select>
        <button id="sort-dir" class="iconbtn" type="button"></button>
      </div>
      <main id="list"></main>
    </section>
    <section id="transferring" hidden>
      <div class="titlebar">
        <h2 id="transferring-title"></h2>
      </div>
      <div class="tabs" role="tablist">
        <button id="tab-add" type="button" role="tab" aria-controls="adding"></button>
        <button id="tab-export" type="button" role="tab" aria-controls="exporting"></button>
      </div>
      <div id="adding" class="panel" role="tabpanel" aria-labelledby="tab-add">
        <div class="hint" id="adding-hint"></div>
        <textarea id="addresses" rows="10" spellcheck="false" autocomplete="off"></textarea>
        <div class="actions">
          <span id="add-result" role="status" aria-live="polite"></span>
          <button id="add-go" class="btn" type="button"></button>
        </div>
      </div>
      <div id="exporting" class="panel" role="tabpanel" aria-labelledby="tab-export" hidden>
        <div class="hint" id="exporting-hint"></div>
        <textarea id="exported" rows="10" spellcheck="false" readonly></textarea>
        <div class="actions">
          <span id="export-result" role="status" aria-live="polite"></span>
          <button id="export-copy" class="btn" type="button"></button>
          <button id="export-save" class="btn" type="button"></button>
        </div>
      </div>
    </section>
    <section id="settings" hidden>
      <div class="titlebar">
        <h2 id="settings-title"></h2>
        <span id="saved" role="status" aria-live="polite"></span>
      </div>
      <div id="thanks">
        <span class="name" id="thanks-name"></span>
        <span class="hint" id="thanks-hint"></span>
        <a id="page-link" class="go" href="https://donate.howar31.com/" target="_blank" rel="noopener"></a>
      </div>
      <div>
        <h3 id="group-general"></h3>
        <div class="group">
          <label class="item">
            <span class="name" id="language-name"></span>
            <select id="language">
              <option id="language-auto" value="auto"></option>
              <option value="en" lang="en">English</option>
              <option value="zh_TW" lang="zh-TW">正體中文</option>
            </select>
          </label>
          <label class="item">
            <span class="name" id="time-format-name"></span>
            <select id="time-format">
              <option id="time-format-24" value="24"></option>
              <option id="time-format-12" value="12"></option>
            </select>
          </label>
          <label class="item">
            <span class="name" id="single-save-name"></span>
            <select id="single-save">
              <option id="single-save-browser" value="browser"></option>
              <option id="single-save-folder" value="folder"></option>
            </select>
            <span class="hint" id="single-save-hint"></span>
          </label>
        </div>
      </div>
      <div>
        <h3 id="group-folders"></h3>
        <div class="group">
          <div class="item valued">
            <span class="name" id="default-name"></span>
            <span class="value" id="default-value"></span>
            <button id="default-change" class="btn" type="button"></button>
          </div>
          <div class="item">
            <span class="name" id="import-name"></span>
            <button id="import" class="btn" type="button"></button>
          </div>
        </div>
      </div>
      <div>
        <h3 id="group-advanced"></h3>
        <div class="group">
          <label class="item">
            <span class="name" id="developer-mode-name"></span>
            <input id="developer-mode" class="switch" type="checkbox" role="switch" />
            <span class="hint" id="developer-mode-hint"></span>
          </label>
        </div>
      </div>
    </section>
    <footer id="version"></footer>
    <script src="popup.js"></script>
  </body>
</html>
